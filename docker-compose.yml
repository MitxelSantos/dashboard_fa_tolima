version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.4-alpine
    container_name: tolima_postgres_prod
    environment:
      POSTGRES_DB: epidemiologia_tolima
      POSTGRES_USER: tolima_admin
      POSTGRES_PASSWORD: tolima2025
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=es_CO.UTF-8 --lc-ctype=es_CO.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - tolima_postgres_data_prod:/var/lib/postgresql/data
      - ./sql_init:/docker-entrypoint-initdb.d:ro
    networks:
      - tolima_epidemiologia_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tolima_admin -d epidemiologia_tolima"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  tolima_postgres_data_prod:
    driver: local

networks:
  tolima_epidemiologia_network:
    driver: bridge
