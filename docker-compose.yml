version: '3.8'

# Docker Compose OPTIMIZADO para Producción - Sistema Epidemiológico Tolima
# Performance: PostgreSQL optimizado, volúmenes persistentes, networking eficiente

services:
  
  # =====================================================
  # PostgreSQL + PostGIS OPTIMIZADO
  # =====================================================
  postgres:
    image: postgis/postgis:15-3.3-alpine
    container_name: tolima_postgres_prod
    
    environment:
      # Configuración base
      POSTGRES_DB: epidemiologia_tolima
      POSTGRES_USER: tolima_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tolima2025}
      
      # Optimizaciones de encoding y locale
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
      LANG: C
      LC_ALL: C
      
      # Configuración de datos
      PGDATA: /var/lib/postgresql/data/pgdata
      
      # Variables de optimización
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_SHARED_PRELOAD_LIBRARIES: pg_stat_statements
    
    ports:
      - "${DB_PORT:-5432}:5432"
    
    volumes:
      # Datos persistentes optimizados
      - postgres_data_prod:/var/lib/postgresql/data
      
      # Scripts de inicialización
      - ./sql_init:/docker-entrypoint-initdb.d:ro
      
      # Backups
      - ./backups:/backups
      
      # Configuración personalizada PostgreSQL
      - ./config/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./config/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    
    command: >
      postgres
      -c config_file=/etc/postgresql/postgresql.conf
      -c hba_file=/etc/postgresql/pg_hba.conf
      -c shared_preload_libraries=pg_stat_statements
      -c log_statement=none
      -c log_min_messages=warning
      -c listen_addresses='*'
      -c max_connections=100
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tolima_admin -d epidemiologia_tolima"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    
    networks:
      - tolima_network
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =====================================================
  # pgAdmin OPTIMIZADO (Opcional para administración)
  # =====================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tolima_pgadmin_prod
    
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@tolima.gov.co
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: 'True'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    
    ports:
      - "${PGADMIN_PORT:-8080}:80"
    
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./config/servers.json:/pgadmin4/servers.json:ro
    
    depends_on:
      postgres:
        condition: service_healthy
    
    restart: unless-stopped
    
    networks:
      - tolima_network
    
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # =====================================================
  # Aplicación Principal OPTIMIZADA
  # =====================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        - PYTHON_VERSION=3.11-slim
    
    container_name: tolima_app_prod
    
    environment:
      # Configuración base de datos
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: epidemiologia_tolima
      DB_USER: tolima_admin
      DB_PASSWORD: ${DB_PASSWORD:-tolima2025}
      
      # Configuración aplicación
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      PYTHONPATH: /app
      PYTHONUNBUFFERED: 1
      
      # Optimizaciones Python
      PYTHONDONTWRITEBYTECODE: 1
      MALLOC_ARENA_MAX: 2
    
    volumes:
      # Datos de entrada
      - ./data:/app/data:ro
      
      # Logs aplicación
      - ./logs:/app/logs
      
      # Backups generados
      - ./backups:/app/backups
      
      # Configuración
      - ./.env:/app/.env:ro
    
    depends_on:
      postgres:
        condition: service_healthy
    
    restart: unless-stopped
    
    command: >
      sh -c "
        echo 'Esperando PostgreSQL...' &&
        sleep 10 &&
        echo 'Ejecutando sistema coordinador...' &&
        python scripts/sistema_coordinador_optimizado.py --essential
      "
    
    networks:
      - tolima_network
    
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.25'
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =====================================================
  # Dashboard Streamlit OPTIMIZADO
  # =====================================================
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    
    container_name: tolima_dashboard_prod
    
    environment:
      # Configuración base de datos
      DATABASE_URL: postgresql://tolima_admin:${DB_PASSWORD:-tolima2025}@postgres:5432/epidemiologia_tolima
      
      # Configuración Streamlit
      STREAMLIT_SERVER_PORT: 8501
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: false
      STREAMLIT_SERVER_MAX_UPLOAD_SIZE: 200
      
      # Cache optimizado
      STREAMLIT_SERVER_ENABLE_STATIC_SERVING: true
      STREAMLIT_SERVER_ENABLE_CORS: false
    
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    
    volumes:
      - ./dashboard:/app/dashboard:ro
      - ./logs:/app/logs
    
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started
    
    restart: unless-stopped
    
    command: >
      sh -c "
        echo 'Esperando datos cargados...' &&
        sleep 30 &&
        echo 'Iniciando dashboard optimizado...' &&
        streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
      "
    
    networks:
      - tolima_network
    
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'
    
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # =====================================================
  # Backup Automático OPTIMIZADO
  # =====================================================
  backup:
    image: postgres:15-alpine
    container_name: tolima_backup_prod
    
    environment:
      PGPASSWORD: ${DB_PASSWORD:-tolima2025}
    
    volumes:
      - ./backups:/backups
      - ./scripts/backup_automated.sh:/backup_automated.sh:ro
    
    depends_on:
      postgres:
        condition: service_healthy
    
    restart: unless-stopped
    
    command: >
      sh -c "
        echo 'Servicio backup iniciado...' &&
        while true; do
          echo 'Ejecutando backup diario...' &&
          /backup_automated.sh postgres tolima_admin epidemiologia_tolima &&
          echo 'Backup completado. Durmiendo 24h...' &&
          sleep 86400
        done
      "
    
    networks:
      - tolima_network
    
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # =====================================================
  # Monitor Sistema OPTIMIZADO
  # =====================================================
  monitor:
    build:
      context: .
      dockerfile: Dockerfile.monitor
    
    container_name: tolima_monitor_prod
    
    environment:
      DATABASE_URL: postgresql://tolima_admin:${DB_PASSWORD:-tolima2025}@postgres:5432/epidemiologia_tolima
      MONITOR_INTERVAL_MINUTES: 60
      ALERT_EMAIL: ${ALERT_EMAIL:-admin@tolima.gov.co}
    
    volumes:
      - ./logs:/app/logs
      - ./scripts:/app/scripts:ro
    
    depends_on:
      postgres:
        condition: service_healthy
    
    restart: unless-stopped
    
    command: >
      sh -c "
        echo 'Monitor sistema iniciado...' &&
        while true; do
          echo 'Ejecutando monitoreo...' &&
          python scripts/monitor_sistema.py --completo &&
          echo 'Monitoreo completado. Durmiendo 1h...' &&
          sleep 3600
        done
      "
    
    networks:
      - tolima_network
    
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

# =====================================================
# VOLÚMENES OPTIMIZADOS
# =====================================================
volumes:
  postgres_data_prod:
    name: tolima_postgres_data_prod
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./postgres_data}
  
  pgadmin_data:
    name: tolima_pgadmin_data
    driver: local

# =====================================================
# NETWORKING OPTIMIZADO
# =====================================================
networks:
  tolima_network:
    name: tolima_epidemiologia_network
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
    driver_opts:
      com.docker.network.bridge.name: tolima_br0

# =====================================================
# CONFIGURACIÓN AVANZADA
# =====================================================

# Variables de entorno requeridas (crear archivo .env):
# DB_PASSWORD=tu_password_seguro
# PGADMIN_PASSWORD=tu_password_pgadmin
# ALERT_EMAIL=tu_email@dominio.com
# DATA_PATH=/path/to/persistent/data
# DB_PORT=5432
# PGADMIN_PORT=8080
# DASHBOARD_PORT=8501

# Comandos útiles:
# docker-compose -f docker-compose.production.yml up -d
# docker-compose -f docker-compose.production.yml logs -f dashboard
# docker-compose -f docker-compose.production.yml exec postgres psql -U tolima_admin -d epidemiologia_tolima
# docker-compose -f docker-compose.production.yml down --volumes (¡CUIDADO! Borra datos)